<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신입 작업치료사, 우리 동네로 출동!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ========== 색상 토큰 ========== */
:root{
  color-scheme:light;
  --bg:#E9EFF5; --surface:#FFFFFF; --surface-2:#F3F6FA; --surface-3:#E4EBF3;
  --ink:#0E1C2F; --ink-2:#3B4B60; --ink-3:#66768B;
  --line:#D2DBE6; --line-2:#B7C4D4;
  --chrome:#0F2A4A; --chrome-2:#183C67; --on-chrome:#FFFFFF; --on-chrome-2:#A7BCD6;
  --navy-ink:#123460;
  --mint:#1DB8A4; --mint-ink:#077668; --mint-soft:#DCF4F0; --mint-line:#93DACF; --on-mint:#04261F;
  --primary:#0F2A4A; --primary-hover:#1C4676; --on-primary:#FFFFFF;
  --ok:#16865A; --ok-soft:#E0F2E9;
  --warn:#B06A05; --warn-soft:#FCEFD9;
  --bad:#C0303B; --bad-soft:#FBE3E5;
  --paper:#FFFDF7; --paper-line:#E6D2AA; --paper-ink:#8A5A06;
  --ink-stamp:#C42B36;
  --map-bg:#EEF4EA; --park:#D5E9CC; --water:#D3E6F1; --road:#CFD8E2; --road-line:#FFFFFF;
  --grid:rgba(15,42,74,.06);
  --stamp-blend:multiply;
  --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 20px rgba(15,42,74,.07);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:16px; --r:11px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1320; --surface:#101C2C; --surface-2:#152338; --surface-3:#1B2C45;
    --ink:#E7EEF7; --ink-2:#B0BED0; --ink-3:#8292A8;
    --line:#22344E; --line-2:#344B6B;
    --chrome:#060E1A; --chrome-2:#0E1C30; --on-chrome:#FFFFFF; --on-chrome-2:#8EA5C3;
    --navy-ink:#A9C7F0;
    --mint:#2BCDB8; --mint-ink:#62E2D0; --mint-soft:#0E3533; --mint-line:#1E6B62; --on-mint:#03211C;
    --primary:#2BCDB8; --primary-hover:#48DCC8; --on-primary:#03211C;
    --ok:#46C98F; --ok-soft:#0F2E21;
    --warn:#F2A945; --warn-soft:#352610;
    --bad:#FF727B; --bad-soft:#3A161B;
    --paper:#17150F; --paper-line:#4A3A1C; --paper-ink:#EBB862;
    --ink-stamp:#FF6A73;
    --map-bg:#0F1A17; --park:#163323; --water:#112A3B; --road:#22344E; --road-line:#3B5070;
    --grid:rgba(255,255,255,.045);
    --stamp-blend:normal;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1320; --surface:#101C2C; --surface-2:#152338; --surface-3:#1B2C45;
  --ink:#E7EEF7; --ink-2:#B0BED0; --ink-3:#8292A8;
  --line:#22344E; --line-2:#344B6B;
  --chrome:#060E1A; --chrome-2:#0E1C30; --on-chrome:#FFFFFF; --on-chrome-2:#8EA5C3;
  --navy-ink:#A9C7F0;
  --mint:#2BCDB8; --mint-ink:#62E2D0; --mint-soft:#0E3533; --mint-line:#1E6B62; --on-mint:#03211C;
  --primary:#2BCDB8; --primary-hover:#48DCC8; --on-primary:#03211C;
  --ok:#46C98F; --ok-soft:#0F2E21;
  --warn:#F2A945; --warn-soft:#352610;
  --bad:#FF727B; --bad-soft:#3A161B;
  --paper:#17150F; --paper-line:#4A3A1C; --paper-ink:#EBB862;
  --ink-stamp:#FF6A73;
  --map-bg:#0F1A17; --park:#163323; --water:#112A3B; --road:#22344E; --road-line:#3B5070;
  --grid:rgba(255,255,255,.045);
  --stamp-blend:normal;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
}

/* ========== 기본 ========== */
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:clamp(16px,.55vw + 11px,21px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--chrome)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.mono{font-family:var(--mono)}

/* ========== 상단 바 ========== */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome);color:var(--on-chrome)}
.tb-inner{display:flex;align-items:center;gap:.8rem;max-width:68rem;margin:0 auto;padding:.5rem clamp(.75rem,2vw,1.25rem);min-height:3.6rem}
.brand{display:flex;align-items:center;gap:.6rem;white-space:nowrap;flex:none}
.brand-mark{width:2.1rem;height:2.1rem;border-radius:.55rem;background:var(--mint);color:var(--on-mint);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.brand-name{display:block;font-weight:700;font-size:.92rem;line-height:1.2}
.brand-sub{display:block;font-size:.7rem;color:var(--on-chrome-2);line-height:1.2}
.tb-right{display:flex;align-items:center;gap:.45rem;flex:none;margin-left:auto}
.pill{position:relative;display:flex;align-items:baseline;gap:.3rem;padding:.35rem .7rem;border-radius:.55rem;background:rgba(255,255,255,.08);font-size:.78rem;color:var(--on-chrome-2);white-space:nowrap}
.pill b{font-family:var(--mono);font-size:1.1rem;color:var(--on-chrome)}
.timer{display:flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.92rem;padding:.35rem .3rem;color:var(--on-chrome)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:2.5rem;min-width:2.5rem;padding:0 .65rem;border-radius:.55rem;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--on-chrome);cursor:pointer;font-size:.84rem;font-weight:600;white-space:nowrap}
.ibtn:hover{background:rgba(255,255,255,.15)}
.ibtn svg{width:1.1rem;height:1.1rem}
.ibtn.mapbtn{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.plus{position:absolute;right:.2rem;top:100%;font-family:var(--mono);font-weight:700;color:var(--mint);font-size:1.05rem;pointer-events:none;animation:plus 1.5s ease-out forwards}
@keyframes plus{0%{opacity:0;transform:translateY(-4px)}15%{opacity:1;transform:translateY(4px)}100%{opacity:0;transform:translateY(24px)}}
@media (max-width:760px){.brand-text,.ibtn .lbl,.pill .of,.timer{display:none}.tb-inner{gap:.45rem}}

/* ========== 공통 ========== */
.ws{max-width:68rem;margin:0 auto;padding:1.25rem clamp(.75rem,2vw,1.25rem) 3rem}
.main.enter{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:clamp(1.1rem,2.4vw,1.9rem)}
.mhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.8rem 1.5rem;margin-bottom:1rem}
.mtag{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:700;color:var(--mint-ink);background:var(--mint-soft);padding:.2rem .65rem;border-radius:.4rem}
.mtag.dark{background:rgba(255,255,255,.12);color:var(--mint)}
.mhead h1{font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.25;margin-top:.45rem;color:var(--navy-ink);letter-spacing:-.015em}
.mmeta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;padding:.3rem .7rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip b{font-family:var(--mono);color:var(--ink)}
.lead{font-size:1.06rem;color:var(--ink-2);max-width:46em}
.lead b{color:var(--ink)}
.h2{font-size:1.25rem;color:var(--navy-ink);line-height:1.35}
.q{font-size:clamp(1.1rem,1.5vw,1.25rem);font-weight:700;line-height:1.45;margin:1.1rem 0 .8rem;color:var(--ink)}
.q small{display:inline-block;margin-left:.4rem;font-size:.75rem;font-weight:600;color:var(--mint-ink);background:var(--mint-soft);padding:.12rem .5rem;border-radius:.3rem;vertical-align:.15em}
.note{display:flex;gap:.6rem;align-items:flex-start;font-size:.9rem;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:.7rem .9rem;margin-top:1rem}
.note svg{flex:none;margin-top:.22em;color:var(--mint-ink)}
.note b{color:var(--ink)}
.keyline{margin-top:1.2rem;padding:.85rem 1rem;border-radius:var(--r);background:var(--navy-ink);color:var(--surface);font-weight:600;font-size:1rem;line-height:1.5}

/* 선택지 */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15.5rem),1fr));gap:.65rem}
.opts.list{grid-template-columns:minmax(0,1fr)}
.opt{position:relative;display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;padding:.8rem 1rem;min-height:3.8rem;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:1rem;line-height:1.4;cursor:pointer;transition:border-color .15s,background-color .15s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--mint-line)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt[aria-pressed="true"]{border-color:var(--mint);background:var(--mint-soft)}
.opt .ot{flex:1;min-width:0}
.opt .onote{display:block;font-size:.84rem;font-weight:500;color:var(--ink-2);margin-top:.3rem}
.opt .box{flex:none;width:1.6rem;height:1.6rem;border-radius:.4rem;border:2px solid var(--line-2);display:grid;place-items:center;color:var(--on-mint);font-size:.95rem}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"] .box{background:var(--mint);border-color:var(--mint)}
.opt:disabled{cursor:default}
.opt.s-good{border-color:var(--ok);background:var(--ok-soft)}
.opt.s-good .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.s-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.s-bad .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.s-miss{border-style:dashed;border-color:var(--warn);background:var(--surface)}
.opt.s-miss .box{background:transparent;border-color:var(--warn);color:var(--warn)}
.opt.s-dim{opacity:.6;background:var(--surface)}

/* 피드백 */
.fbx{margin-top:1rem;padding:.85rem 1rem;border-radius:var(--r);background:var(--surface-2);border-left:4px solid var(--ok);font-size:.96rem;color:var(--ink-2);display:grid;gap:.25rem}
.fbx.no{border-left-color:var(--bad)}
.fbx b{color:var(--ink);font-size:1.02rem}
.think{display:flex;gap:.7rem;align-items:flex-start;margin-top:1rem;padding:.9rem 1rem;border-radius:var(--r);background:var(--surface-2);border:1px dashed var(--mint-line);font-size:.95rem;color:var(--ink-2)}
.think svg{flex:none;color:var(--mint-ink);width:1.3rem;height:1.3rem;margin-top:.1rem}
.think b{color:var(--mint-ink)}

/* 하단 버튼 영역 */
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem 1rem;margin-top:1.4rem;padding-top:1.1rem;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.2rem;padding:.65rem 1.4rem;border-radius:.7rem;border:2px solid transparent;font-weight:700;font-size:1.02rem;cursor:pointer;transition:background-color .15s,border-color .15s,transform .08s;white-space:nowrap}
.btn svg{width:1.1em;height:1.1em}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover:not(:disabled){background:var(--primary-hover)}
.btn.mint{background:var(--mint);color:var(--on-mint)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2)}
.btn.big{min-height:3.8rem;font-size:1.12rem;padding:.8rem 2rem}
.btn.wide{width:100%;margin-top:1.1rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:.88rem;color:var(--ink-3)}
.rstrip{display:flex;align-items:center;gap:1rem;flex:1;min-width:min(100%,18rem)}
.rpts{flex:none;display:flex;align-items:baseline;gap:.25rem;padding:.45rem .85rem;border-radius:.6rem;background:var(--mint-soft);color:var(--mint-ink);font-weight:600;white-space:nowrap}
.rpts b{font-family:var(--mono);font-size:1.5rem}
.rmsg{font-size:.98rem;color:var(--ink-2);font-weight:500}
@media (max-width:560px){.btn{white-space:normal}.actions > .btn{width:100%}}

/* 단계 블록 */
.stepblock{margin-top:1.3rem;padding-top:1.2rem;border-top:1px solid var(--line);scroll-margin-top:5.5rem}
.sb-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.sb-n{display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--navy-ink);color:var(--surface);font-family:var(--mono);font-weight:600;font-size:.9rem;flex:none}
.sb-head h2{font-size:1.15rem;color:var(--navy-ink)}
.sb-of{margin-left:auto;font-size:.8rem;color:var(--ink-3)}
.stepdone{margin-top:1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.stepdone summary{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;cursor:pointer;font-weight:600;list-style:none}
.stepdone summary::-webkit-details-marker{display:none}
.stepdone .sb-n{background:var(--ok);width:1.6rem;height:1.6rem;font-size:.8rem}
.sd-pts{margin-left:auto;font-family:var(--mono);font-size:.85rem;color:var(--ink-3);white-space:nowrap}
.sd-body{padding:0 .9rem .9rem}

/* ========== 시작 화면 ========== */
.start{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.25rem}
@media (max-width:900px){.start{grid-template-columns:minmax(0,1fr)}}
.hero{position:relative;overflow:hidden;background:var(--chrome);color:var(--on-chrome);border-radius:var(--r-lg);padding:clamp(1.5rem,3.5vw,2.6rem);display:grid;gap:1.4rem;align-content:start}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.hero > *{position:relative}
.hero-pills{display:flex;flex-wrap:wrap;gap:.4rem}
.hp{font-size:.78rem;font-weight:600;padding:.25rem .6rem;border-radius:.4rem;background:rgba(255,255,255,.1);color:var(--on-chrome)}
.hero h1{font-size:clamp(2rem,4.2vw,3.3rem);line-height:1.18;letter-spacing:-.025em;margin:.9rem 0 .6rem;font-weight:700}
.hero .sub{font-size:clamp(1rem,1.5vw,1.18rem);color:var(--mint);font-weight:600}
.hero-story{margin-top:.9rem;font-size:1rem;color:var(--on-chrome-2);max-width:32em}
.course{list-style:none;margin:0;padding:0;display:grid}
.course li{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:.7rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.course li:last-child{border-bottom:0}
.course .ic{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:1.2rem}
.course b{display:block;font-size:.96rem;line-height:1.35}
.course small{display:block;color:var(--ink-3);font-size:.8rem;line-height:1.4}
.field{display:grid;gap:.35rem;margin-top:1rem}
.field label{font-size:.84rem;font-weight:600;color:var(--ink-2)}
.input{font:inherit;font-size:1rem;padding:.65rem .85rem;border-radius:.6rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.input:focus{outline:none;border-color:var(--mint)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem;margin-top:1.25rem}
@media (max-width:820px){.howto{grid-template-columns:minmax(0,1fr)}}
.howto > div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.8rem;align-items:start}
.howto .hi{font-size:1.7rem;line-height:1.2}
.howto b{display:block;font-size:1rem;margin-bottom:.15rem}
.howto p{font-size:.9rem;color:var(--ink-2)}
.howto .note{grid-column:1/-1;margin-top:0}

/* ========== 스탬프 카드 ========== */
.stampcard{background:var(--paper);color:var(--ink);border:1px solid var(--paper-line);border-radius:var(--r-lg);padding:1rem 1.1rem 1.1rem}
.hero .stampcard{max-width:30rem}
.sc-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.3rem .8rem}
.sc-head b{font-size:1rem;color:var(--paper-ink)}
.sc-head span{font-size:.82rem;color:var(--ink-3)}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem;margin-top:.75rem}
@media (max-width:560px){.slots{grid-template-columns:repeat(3,minmax(0,1fr))}}
.slot{aspect-ratio:1;border-radius:50%;border:2px dashed var(--paper-line);display:grid;place-items:center;font-family:var(--mono);font-size:.85rem;color:var(--ink-3);position:relative}
.slot.on{border-color:transparent}
.sstamp{width:94%;height:94%;border-radius:50%;border:.2rem solid var(--ink-stamp);box-shadow:inset 0 0 0 .14rem var(--paper),inset 0 0 0 .27rem var(--ink-stamp);color:var(--ink-stamp);display:grid;place-content:center;justify-items:center;gap:.05rem;transform:rotate(var(--rot,-10deg));mix-blend-mode:var(--stamp-blend);filter:url(#ink);font-family:var(--font)}
.sstamp .ic{font-size:clamp(1rem,2.6vw,1.45rem);line-height:1}
.sstamp .tx{font-size:clamp(.5rem,1.3vw,.62rem);font-weight:700;line-height:1.1;text-align:center}
.sstamp.new{animation:stampIn .65s .25s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stampIn{0%{opacity:0;transform:scale(2.6) rotate(0deg)}55%{opacity:1;transform:scale(.9) rotate(var(--rot,-10deg))}75%{transform:scale(1.06) rotate(var(--rot,-10deg))}100%{opacity:1;transform:scale(1) rotate(var(--rot,-10deg))}}

/* ========== 동네 지도 ========== */
.map{position:relative;border-radius:var(--r-lg);border:1px solid var(--line);background-color:var(--map-bg);background-image:radial-gradient(circle at 10% 14%,var(--park) 0 3rem,transparent 3.1rem),radial-gradient(circle at 92% 58%,var(--park) 0 4.2rem,transparent 4.3rem),radial-gradient(ellipse at 14% 88%,var(--water) 0 4rem,transparent 4.1rem),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,auto,auto,22px 22px,22px 22px;padding:1.6rem clamp(.8rem,3vw,2rem);overflow:hidden;margin-top:1rem}
.route{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:3rem;row-gap:.9rem;max-width:46rem;margin:0 auto}
.route::before{content:"";position:absolute;top:1rem;bottom:1rem;left:50%;width:.7rem;margin-left:-.35rem;background:var(--road);border-radius:999px}
.route::after{content:"";position:absolute;top:1.4rem;bottom:1.4rem;left:50%;border-left:2px dashed var(--road-line);margin-left:-1px}

  const STEP_KEY = {};

  function freshState(keep) {

      screen: 'start',

      done: { m1: false, m3: false, m4: false, m5: false, m6: false },
      stamped: null,
      mem: { order: shuffle(MEM_CARDS.map((_, i) => i)), up: [], matched: [], misses: 0, lock: false, done: false },
      decks: {},
      ch: {},
      mu: {},
      time: 0,
      focus: null,
    };
  }
  let S = freshState();

  const total = () => Object.values(S.pts).reduce((a, b) => a + b, 0);
  const mpts = (mk) => Object.keys(S.pts).filter((k) => k.startsWith(mk + '.')).reduce((a, k) => a + S.pts[k], 0);
  const stopOf = (mk) => STOPS.find((s) => s.key === mk);
  const stampCount = () => Object.values(S.done).filter(Boolean).length;
  const ds = (id) => S.decks[id] || (S.decks[id] = { i: 0, ans: [], show: false, done: false });

  const us = (id) => S.mu[id] || (S.mu[id] = { sel: [], done: false });

  function stepMax(s) {
    if (s.type === 'memory') return 8;
    if (s.type === 'deck') return DECKS[s.id].max;
    if (s.type === 'choice') return CHOICES[s.id].pts;
    return MULTIS[s.id].max;
  }
  function answered(s) {
    if (s.type === 'memory') return S.mem.done;
    if (s.type === 'deck') return ds(s.id).done;
    if (s.type === 'choice') return cs(s.id).done;
    return us(s.id).done;
  }
  function award(key, pts) {
    const before = total();
    S.pts[key] = pts;
    countTo($('#scoreNum'), before, total(), 700);
    const pill = $('#scorePill');
    if (pill && pts > 0) {
      const f = document.createElement('span');
      f.className = 'plus';
      f.textContent = '+' + pts;
      pill.appendChild(f);
      setTimeout(() => f.remove(), 1600);
    }
    const mk = key.split('.')[0];
    const flow = FLOW[mk];
    if (flow && !S.done[mk] && answered(flow[flow.length - 1])) {
      S.done[mk] = true;
      S.stamped = mk;
      const sp = $('#stampNum'); if (sp) sp.textContent = String(stampCount());
    }

  function countTo(el, from, to, dur) {
    if (!el) return;
    if (reduceMotion || from === to) { el.textContent = String(to); return; }
    const t0 = performance.now();
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      el.textContent = String(Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  const INTRO = {
    m1: () => `<p class="lead">출근 버스 안이에요. 오늘 지역사회에서 쓸 이론 모델을 복습해요. 모델 이름 카드와 핵심어 카드를 찾아 짝을 지어 보세요.</p>`,
    m3: () => `<p class="lead">보건소 지역사회중심재활(CBR)팀 회의예요. 올해 프로그램을 WHO의 <b>CBR 매트릭스</b> 5개 영역에 맞춰 정리해요.</p>
      <div class="note">${ICON.info}<span><b>지역사회중심재활(CBR)</b>은 지역사회의 인적·물적 자원과 주변 기관의 연계를 활용해, 장애인이나 노인 같은 건강취약계층에게 전인적인 재활 서비스를 제공하는 것이에요. 삶의 질을 높이고 사회통합을 이루는 것이 목표예요.</span></div>`,
    m4: () => `<p class="lead">행정복지센터의 케어안내창구예요. 정부의 ‘지역사회 통합 돌봄 기본계획(1단계: 노인 커뮤니티케어)’은 노인이 살던 곳에서 계속 생활하도록 <b>4대 중점과제</b>를 제시했어요.</p>
      <div class="tags"><span class="em">주거</span><span class="em">건강·의료</span><span class="em">요양·돌봄</span><span class="em">서비스 통합 제공</span></div>`,
    m5: () => `<article class="casecard"><div class="ch"><span>방문작업치료 의뢰서</span><span>가상 사례</span></div>
        <div class="cb"><span class="av" aria-hidden="true">👵</span>
          <dl class="kv">
            <dt>대상자</dt><dd>박OO, 82세 여성</dd>
            <dt>거주</dt><dd>단독주택에서 10년째 혼자 생활</dd>
            <dt>경과</dt><dd>3개월 전 집에서 넘어져 고관절 골절 수술. 병세는 안정됐지만 일상생활이 어려워졌어요.</dd>
            <dt>가족</dt><dd>딸이 매주 반찬을 챙겨 주는데, 다음 달 먼 곳으로 이사할 예정이에요.</dd>

      <p class="hint" style="margin-top:.9rem">집에서 꼭 살펴볼 곳: 주택 환경의 안전성과 접근성이 첫 번째 관심사예요.</p>
      <div class="tags"><span>🛏️ 침실</span><span>🚿 화장실·욕실</span><span>🍳 부엌</span><span>🛋️ 거실</span><span class="em">🚪 현관</span><span class="em">🧺 세탁실</span><span class="em">🌿 베란다</span></div>
      <p class="hint" style="margin-top:.4rem">혼자 사시는 분이라 현관, 세탁실, 베란다도 꼭 확인해요.</p>`,
    m6: () => `<p class="lead">첫 평가를 마치고 다시 할머니 댁을 찾았어요. 이제 평가 결과를 바탕으로 중재를 계획하고, 마무리까지 해 볼 차례예요.</p>
      <div class="tags"><span>① 관찰 및 평가</span><span class="em">② 중재</span><span class="em">③ 재평가</span><span class="em">④ 종결</span></div>`,
  };

  function memBody() {
    const M = S.mem;
    const cards = M.order.map((ci, pos) => {
      const c = MEM_CARDS[ci];
      const isUp = M.up.includes(pos) || M.matched.includes(pos);
      const ok = M.matched.includes(pos);
      const face = c.kind === 'name'
        ? `<span class="face name"><b>${c.p.name}</b><small>${c.p.sub}</small></span>`
        : `<span class="face key">${c.p.key}</span>`;
      return `<button type="button" class="mc${isUp ? ' up' : ''}${ok ? ' ok' : ''}" data-act="mem" data-i="${pos}" aria-label="${isUp ? (c.kind === 'name' ? c.p.name : c.p.key) : '카드 ' + (pos + 1) + ', 뒤집기'}"${M.done ? ' disabled' : ''}><span class="back" aria-hidden="true"><span>?</span></span>${face}</button>`;
    }).join('');
    let h = `<div class="memtop"><span class="chip">찾은 짝 <b id="memPairs">${M.matched.length / 2}</b> / 6</span><span class="chip">빗나간 횟수 <b id="memMiss">${M.misses}</b></span></div><div class="mem" id="memGrid">${cards}</div>`;
    if (M.done) {
      h += `<h3 class="h2" style="margin-top:1.3rem;font-size:1.1rem">모델 도감 완성!</h3>
        <div class="dex">${PAIRS.map((p) => `<div><b>${p.name} <span class="hint">${p.sub}</span></b><span class="kw">${p.key}</span><p>${p.desc}</p></div>`).join('')}</div>`;
    }
    return h;
  }

  function deckCard(D, it, cls) {
    if (D.skin === 'bubble') {
      return `<div class="dcard bubble${cls}"><span class="bub-who"><span aria-hidden="true">${it.av}</span><span>${it.who}</span></span><span class="bub">“${it.t}”</span></div>`;
    }
    if (D.skin === 'quote') {
      return `<div class="dcard${cls}"><span class="src">${it.src}</span><span>${it.src === '할머니' ? '“' + it.t + '”' : it.t}</span></div>`;
    }
    return `<div class="dcard ${D.skin}${cls}"><span>${it.t}</span></div>`;
  }
  function deckBody(id) {
    const D = DECKS[id], st = ds(id);
    const n = D.items.length;
    const correct = st.ans.filter((a, i) => a === D.items[i].a).length;
    let h = D.hint ? hintBox(D.hint) : '';
    if (st.done) {
      h += `<ul class="dsum">${D.items.map((it, i) => {
        const ok = st.ans[i] === it.a;
        return `<li><span class="mk ${ok ? 'ok' : 'no'}" aria-label="${ok ? '정답' : '오답'}">${ok ? ICON.check : ICON.x}</span><span>${it.t}</span><span class="an">${D.cats[it.a]}</span></li>`;
      }).join('')}</ul>`;
      h += `<p class="hint" style="margin-top:.6rem">${n}장 중 ${correct}장을 맞혔어요.</p>`;
      if (D.after) h += D.after;
      return h;
    }
    const it = D.items[st.i];
    const pick = st.show ? st.ans[st.i] : null;
    const ok = pick === it.a;
    const dots = D.items.map((x, i) => `<i class="${i < st.i || (i === st.i && st.show) ? (st.ans[i] === x.a ? 'ok' : 'no') : i === st.i ? 'cur' : ''}"></i>`).join('');
    h += `<div class="deckbar"><span>카드 <b>${st.i + 1}</b> / ${n}</span><span class="dots" aria-hidden="true">${dots}</span></div>`;
    h += deckCard(D, it, st.show ? (ok ? ' ok' : ' no') : '');
    h += `<div class="bins${D.skin === 'ox' ? ' ox' : ''}" role="group" aria-label="분류 선택">${D.cats.map((c, ci) => {
      let cls = '';
      if (st.show) { if (ci === it.a) cls = ' ans'; else if (ci === pick) cls = ' pick-no'; }
      return `<button type="button" class="bin${cls}" data-act="pick" data-k="${id}" data-i="${ci}"${st.show ? ' disabled' : ''}>${c}${D.catSub ? `<small>${D.catSub[ci]}</small>` : ''}</button>`;
    }).join('')}</div>`;
    if (st.show) {
      h += `<div class="dfb${ok ? '' : ' no'}" aria-live="polite"><b>${ok ? '정답이에요!' : `아쉬워요! 정답: ‘${D.cats[it.a]}’`}</b><span>${it.why}</span></div>`;
      h += `<div class="dnext"><button type="button" class="btn primary" id="deckNext" data-act="deck-next" data-k="${id}">${st.i < n - 1 ? '다음 카드' : '결과 정리 보기'}</button></div>`;
    }
    return h;
  }

  function choiceBody(id) {
    const C = CHOICES[id], st = cs(id);
    const ci = C.opts.findIndex((o) => o.ok);
    let h = `<p class="q">${C.q}</p><div class="opts list">${C.opts.map((o, i) => opt({
      act: 'ch-pick', k: id, i, radio: true, label: o.t, pressed: st.pick === i,
      state: st.done ? (o.ok ? (st.pick === i ? 'good' : 'miss') : (st.pick === i ? 'bad' : 'dim')) : '',
      note: st.done && !o.ok && st.pick === i ? o.n : '',
      disabled: st.done,
    })).join('')}</div>`;
    if (!st.done) {
      h += `<div class="actions"><span class="hint">고른 뒤 확인을 눌러요</span><button type="button" class="btn primary" data-act="ch-submit" data-k="${id}"${st.pick == null ? ' disabled' : ''}>확인</button></div>`;
    } else {
      const ok = st.pick === ci;
      h += `<div class="fbx${ok ? '' : ' no'}"><b>${ok ? '정답이에요!' : '다시 볼까요?'}</b><span>${C.fb}</span></div>`;
    }
    return h;
  }

  function multiBody(id) {
    const U = MULTIS[id], st = us(id);
    let h = `<p class="q">${U.q} <small>복수 선택</small></p><div class="opts list">${U.items.map((it, i) => {
      const sel = st.sel.includes(i);
      return opt({
        act: 'mu-toggle', k: id, i, label: it.t, pressed: sel,
        state: st.done ? (it.ok ? (sel ? 'good' : 'miss') : (sel ? 'bad' : 'dim')) : '',
        note: st.done ? it.n : '',
        disabled: st.done,
      });
    }).join('')}</div>`;
    if (!st.done) {
      h += `<div class="actions"><span class="hint">${st.sel.length}개 선택됨</span><button type="button" class="btn primary" data-act="mu-submit" data-k="${id}"${st.sel.length ? '' : ' disabled'}>확인</button></div>`;
    } else {
      h += `<div class="fbx"><b>정리해 볼까요?</b><span>${U.fb}</span></div>`;
      if (U.after) h += U.after;
    }
    return h;
  }

  function stepBody(s) {
    if (s.type === 'memory') return memBody();
    if (s.type === 'deck') return deckBody(s.id);
    if (s.type === 'choice') return choiceBody(s.id);
    return multiBody(s.id);
  }

  function viewMission(mk) {
    const st = stopOf(mk), flow = FLOW[mk];
    let cur = flow.findIndex((s, i) => !S.ack[mk + '.' + i]);
    if (cur === -1) cur = flow.length - 1;
    let h = mhead(st) + INTRO[mk]();
    flow.forEach((s, i) => {
      const key = mk + '.' + i;
      if (i < cur) {
        h += doneStep(i + 1, s.title, S.pts[key] || 0, stepMax(s), stepBody(s));
      } else if (i === cur) {
        let inner = stepBody(s);
        if (answered(s)) {
          if (i < flow.length - 1) {
            inner += `<div class="actions"><span class="rpts"><b>+${S.pts[key] || 0}</b>점 / ${stepMax(s)}점</span><button type="button" class="btn primary" data-act="step-next" data-k="${key}">다음 단계로</button></div>`;
          } else {
            const p = mpts(mk), r = p / st.max;
            const msg = r >= 0.9 ? '완벽해요! 스탬프를 당당하게 받아 가세요.' : r >= 0.7 ? '좋아요! 헷갈린 부분은 위의 해설을 한 번 더 보세요.' : '괜찮아요. 해설을 다시 보며 핵심을 정리해 봐요.';
            inner += `<p class="keyline">${KEYLINE[mk]}</p><div class="actions">${rstrip(p, st.max, msg)}<button type="button" class="btn mint big" data-act="to-map">🏅 스탬프 받고 지도로</button></div>`;
          }
        }
        h += block(i + 1, flow.length, s.title, inner);
      }
    });
    return `<div class="panel">${h}</div>`;
  }

  /* ================= 화면: 결과 ================= */
  function viewResult() {
    const t = total();
    const title = t >= 90 ? '동네가 믿고 찾는 작업치료사' : t >= 75 ? '든든한 우리 동네 작업치료사' : t >= 60 ? '동네 지리를 익히는 중인 작업치료사' : '선배와 한 바퀴 더 도는 작업치료사';
    const nm = S.name.trim();
    return `<section class="result">
      <div class="rhero">
        <div>
          <span class="mtag dark">오늘의 근무 끝</span>
          <h1>${nm ? esc(nm) + ' 선생님,' : '신입 작업치료사님,'}<br>우리 동네 한 바퀴를 모두 돌았어요</h1>
          <span class="rtitle">${title}</span>
          <p class="rtime">${ICON.clock} 총 진행 시간 <b class="mono">${fmt(S.time)}</b></p>
        </div>
        <div class="rscore" aria-label="총점 ${t}점"><b id="countUp">0</b><span>/ 100점</span></div>
      </div>
      ${stampCard('스탬프 투어 완주')}
      <div class="rgrid">
        <div class="panel"><h2 class="h2">장소별 점수</h2>${STOPS.map((s) => { const p = mpts(s.key); return `<div class="rbar"><span class="nm">${s.icon} ${s.place}<small>${s.title}</small></span><span class="pt">${p} / ${s.max}</span><span class="track"><i data-w="${Math.round((p / s.max) * 100)}"></i></span></div>`; }).join('')}</div>
        <div class="panel rsum"><h2 class="h2">오늘 기억할 다섯 가지</h2><ol>${SUMMARY.map((s) => `<li><span class="ic" aria-hidden="true">${s[0]}</span><div><b>${s[1]}</b><span>${s[2]}</span></div></li>`).join('')}</ol></div>
      </div>
      <blockquote class="rquote"><p>“작업치료는 병원 문을 나선 뒤에도, 노인이 살아가는 집과 지역사회에서 계속된다.”</p></blockquote>
      <div class="actions"><span class="hint">박OO 할머니와 미래구는 수업용 가상 설정이에요.</span><button type="button" class="btn primary big" data-act="restart-ask">${ICON.restart} 처음부터 다시 하기</button></div>
    </section>`;
  }

  /* ================= 렌더링 ================= */
  function sig(el) {
    if (!el || !el.dataset || !el.dataset.act) return null;
    return [el.dataset.act, el.dataset.k || '', el.dataset.i || ''].join('|');
  }
  function restoreFocus(s) {
    if (!s) return;
    const [a, k, i] = s.split('|');
    const el = document.querySelector(`[data-act="${a}"]` + (k ? `[data-k="${k}"]` : '') + (i ? `[data-i="${i}"]` : ''));
    if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
  }
  function renderAll(anim) { renderTop(); renderMain(anim); }
  function renderMain(anim, scrollId) {
    const main = $('#main');
    const focusSig = anim ? null : sig(document.activeElement);
    const y = window.scrollY;
    let html;
    if (S.screen === 'start') html = viewStart();
    else if (S.screen === 'map') html = viewMap();
    else if (S.screen === 'result') html = viewResult();
    else html = viewMission(S.screen);
    main.innerHTML = html;
    if (anim) {
      main.classList.remove('enter');
      void main.offsetWidth;
      main.classList.add('enter');
      window.scrollTo(0, 0);
    } else {
      window.scrollTo(0, y);
      if (S.focus) {
        const f = document.getElementById(S.focus);
        if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } }
      } else {
        restoreFocus(focusSig);
      }
    }
    S.focus = null;
    if (scrollId) {
      const t = document.getElementById(scrollId);
      if (t) requestAnimationFrame(() => t.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }));
    }
    if (S.screen === 'map' && S.stamped) {
      S.stamped = null;
    }
    if (S.screen === 'result') {
      if (anim) countTo($('#countUp'), 0, total(), 1400); else { const c = $('#countUp'); if (c) c.textContent = String(total()); }
      requestAnimationFrame(() => requestAnimationFrame(() => {
        document.querySelectorAll('.track i').forEach((i) => { i.style.width = i.dataset.w + '%'; });
      }));
      S.stamped = null;
    }
  }

  let last = performance.now();
  function tick() {
    const now = performance.now();
    const dt = Math.min(2, (now - last) / 1000);
    last = now;
    if (S.screen === 'start' || S.screen === 'result') return;
    S.time += dt;
    const t = $('#tTotal'); if (t) t.textContent = fmt(S.time);
  }

  /* ================= 짝 맞추기 ================= */
  function memClick(el) {
    const M = S.mem;
    if (M.done || M.lock) return;
    const pos = Number(el.dataset.i);
    if (M.up.includes(pos) || M.matched.includes(pos)) return;
    M.up.push(pos);
    el.classList.add('up');
    const c = MEM_CARDS[M.order[pos]];
    el.setAttribute('aria-label', c.kind === 'name' ? c.p.name : c.p.key);
    if (M.up.length < 2) return;
    const [a, b] = M.up;
    const ca = MEM_CARDS[M.order[a]], cb = MEM_CARDS[M.order[b]];
    const ea = document.querySelector(`.mc[data-i="${a}"]`), eb = document.querySelector(`.mc[data-i="${b}"]`);
    if (ca.pair === cb.pair && ca.kind !== cb.kind) {
      M.matched.push(a, b);
      M.up = [];
      [ea, eb].forEach((e) => { if (e) { e.classList.add('ok'); } });
      const mp = $('#memPairs'); if (mp) mp.textContent = String(M.matched.length / 2);
      if (M.matched.length === MEM_CARDS.length) {
        M.done = true;
        const pts = M.misses <= 4 ? 8 : M.misses <= 7 ? 7 : M.misses <= 10 ? 6 : 5;
        award(STEP_KEY['memory:'], pts);
        setTimeout(() => renderMain(false), 650);
      }
    } else {
      M.misses += 1;
      M.lock = true;
      const mm = $('#memMiss'); if (mm) mm.textContent = String(M.misses);
      [ea, eb].forEach((e) => { if (e) e.classList.add('wrong'); });
      setTimeout(() => {
        [ea, eb].forEach((e) => { if (e) { e.classList.remove('up', 'wrong'); e.setAttribute('aria-label', '카드 ' + (Number(e.dataset.i) + 1) + ', 뒤집기'); } });
        M.up = [];
        M.lock = false;
      }, 900);
    }
  }

  /* ================= 모달 ================= */
  function openModal(html) {
    const prev = $('#modalBack'); if (prev) prev.remove();
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.id = 'modalBack';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    back.addEventListener('click', (e) => { if (e.target === back) closeModal(); });
    document.body.appendChild(back);
    const f = back.querySelector('[data-autofocus]') || back.querySelector('button');
    if (f) f.focus();
  }
  function closeModal() { const m = $('#modalBack'); if (m) m.remove(); }

  /* ================= 동작 ================= */
  const A = {
    start() { go('map'); },
    'to-map'() { go('map'); },
    'to-result'() { go('result'); },
    enter(el) { go(el.dataset.k); },
    full() {
      if (!document.fullscreenElement) {
        const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(() => toast('이 화면에서는 전체 화면을 열 수 없어요.'));
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    },
    'restart-ask'() {
      openModal(`<h2>처음부터 다시 시작할까요?</h2><p class="mdesc">점수, 스탬프, 진행 상황이 모두 초기화돼요.</p>
        <div class="actions"><button type="button" class="btn ghost" data-act="modal-close" data-autofocus>취소</button><button type="button" class="btn primary" data-act="restart-confirm">${ICON.restart} 다시 시작</button></div>`);
    },
    'restart-confirm'() { S = freshState({ name: S.name }); closeModal(); renderAll(true); },
    'modal-close'() { closeModal(); },

    mem(el) { memClick(el); },
    'step-next'(el) { S.ack[el.dataset.k] = true; renderMain(false, 'cur'); },

    pick(el) {
      const id = el.dataset.k, st = ds(id);
      if (st.show || st.done) return;
      st.ans[st.i] = Number(el.dataset.i);
      st.show = true;
      S.focus = 'deckNext';
      renderMain(false);
    },
    'deck-next'(el) {
      const id = el.dataset.k, st = ds(id), D = DECKS[id];
      if (!st.show) return;
      st.show = false;
      st.i += 1;
      if (st.i >= D.items.length) {
        st.done = true;
        st.i = D.items.length - 1;
        const c = st.ans.filter((a, i) => a === D.items[i].a).length;
        award(STEP_KEY['deck:' + id], D.score(c));
      }
      renderMain(false);
      if (!st.done) { const b = document.querySelector(`.bin[data-k="${id}"]`); if (b) { try { b.focus({ preventScroll: true }); } catch (e) { b.focus(); } } }
    },

    'ch-pick'(el) { const st = cs(el.dataset.k); if (st.done) return; st.pick = Number(el.dataset.i); renderMain(false); },
    'ch-submit'(el) {
      const id = el.dataset.k, st = cs(id), C = CHOICES[id];
      if (st.done || st.pick == null) return;
      st.done = true;
      award(STEP_KEY['choice:' + id], C.opts[st.pick].ok ? C.pts : 0);
      renderMain(false);
    },
    'mu-toggle'(el) {
      const st = us(el.dataset.k);
      if (st.done) return;
      const i = Number(el.dataset.i);
      const at = st.sel.indexOf(i);
      if (at >= 0) st.sel.splice(at, 1); else st.sel.push(i);
      renderMain(false);
    },
    'mu-submit'(el) {
      const id = el.dataset.k, st = us(id), U = MULTIS[id];
      if (st.done || !st.sel.length) return;
      st.done = true;
      const g = st.sel.filter((i) => U.items[i].ok).length;
      const b = st.sel.length - g;
      award(STEP_KEY['multi:' + id], U.score(g, b));
      renderMain(false);
    },
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t && t.dataset && t.dataset.input === 'name') {
      S.name = t.value.slice(0, 16);
      const head = document.querySelector('.hero .sc-head span');
      if (head) head.textContent = (S.name.trim() ? S.name.trim() + ' 선생님' : '신입 작업치료사') + ' · 스탬프 ' + stampCount() + ' / 5';
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#modalBack')) closeModal();
  });

  renderAll(true);
  setInterval(tick, 500);
})();
</script>
</body>
</html>
